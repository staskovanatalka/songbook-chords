<app-header
  (toggleSidebar)="sidebarCollapsed.set(!sidebarCollapsed())"
  (openConverter)="activeView.set('converter')"
  (openTuner)="isTunerOpen.set(true)"
></app-header>

<div class="app-container">
  <div class="main-layout">

    <!-- Sidebar -->
    <div [class.collapsed]="sidebarCollapsed()" class="sidebar-panel">
      <app-sidebar></app-sidebar>
    </div>

    <!-- Main Content -->
    <div class="content-panel">
      @switch (activeView()) {
        @case ('detail') {
          <app-song-detail (editSong)="activeView.set('edit')"></app-song-detail>
        }
        @case ('edit') {
          <app-song-editor
            [song]="songService.activeSong()"
            (cancel)="activeView.set('detail')"
          ></app-song-editor>
        }
        @case ('converter') {
          <app-converter (close)="activeView.set('detail')"></app-converter>
        }
      }
    </div>

  </div>
</div>

@if (isTunerOpen()) {
  <app-tuner-modal (close)="isTunerOpen.set(false)"></app-tuner-modal>
}
